# ╔══════════════════════════════════════════════════════════════════════╗
# ║  NGINX — piediabetico.lat                                          ║
# ║  Archivo: /etc/nginx/sites-available/piediabetico                  ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  Instrucciones de instalación:                                     ║
# ║                                                                    ║
# ║  1. Copiar este archivo al VPS:                                    ║
# ║     sudo nano /etc/nginx/sites-available/piediabetico              ║
# ║     (pegar el contenido y guardar)                                 ║
# ║                                                                    ║
# ║  2. Activar el sitio:                                              ║
# ║     sudo ln -s /etc/nginx/sites-available/piediabetico \           ║
# ║               /etc/nginx/sites-enabled/                            ║
# ║                                                                    ║
# ║  3. Verificar y recargar:                                          ║
# ║     sudo nginx -t && sudo systemctl reload nginx                   ║
# ║                                                                    ║
# ║  4. Obtener SSL con Certbot (después de apuntar el DNS):           ║
# ║     sudo certbot --nginx -d piediabetico.lat \                     ║
# ║                           -d www.piediabetico.lat                  ║
# ║                                                                    ║
# ║  Certbot modifica este archivo automáticamente para agregar HTTPS  ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Redirigir HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name piediabetico.lat www.piediabetico.lat;

    # Certbot usará este bloque para validar el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás redirige a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name piediabetico.lat www.piediabetico.lat;

    # ── SSL — Certbot completa estas líneas automáticamente ───────────
    # ssl_certificate     /etc/letsencrypt/live/piediabetico.lat/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/piediabetico.lat/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Tamaño máximo de upload (fotos médicas) ───────────────────────
    client_max_body_size 20M;

    # ── Timeouts (para el análisis de IA que puede tardar ~5s) ───────
    proxy_read_timeout    120s;
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;

    # ── Landing page (archivo estático) ──────────────────────────────
    location = / {
        root /var/www/piediabetico;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|css|js|ico|png|jpg|jpeg|svg|woff|woff2)$ {
        root /var/www/piediabetico;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API FastAPI (proxy al contenedor Docker) ──────────────────────
    location /api/ {
        proxy_pass         http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── Swagger UI (acceso directo para el equipo técnico) ────────────
    location /docs {
        proxy_pass         http://localhost:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://localhost:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Endpoints de la API (acceso directo sin prefijo /api/) ────────
    location /agentes/ {
        proxy_pass         http://localhost:8000/agentes/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /analizar-foto {
        proxy_pass         http://localhost:8000/analizar-foto;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    location /orquestador/ {
        proxy_pass         http://localhost:8000/orquestador/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── MinIO — consola web (solo para el equipo, no público) ─────────
    # Comentar estas líneas si no querés exponer la consola de MinIO
    location /minio/ {
        proxy_pass         http://localhost:9001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Logs ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/piediabetico_access.log;
    error_log  /var/log/nginx/piediabetico_error.log warn;
}
