<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>ERD PieDiabetico.lat v0.1</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- FONDO -->
<rect width="1100" height="820" fill="#F8FAFB" rx="12"/>
<text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A2E">ERD — piediabetico.lat v0.1 · PostgreSQL 16 + pgvector</text>

<!-- ═══ ORGANIZATIONS ═══ -->
<g id="organizations">
  <rect x="20" y="45" width="190" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="20" y="45" width="190" height="26" rx="8" fill="#2563EB"/>
  <rect x="20" y="63" width="190" height="8" fill="#2563EB"/>
  <text x="115" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="white">organizations</text>
  <text x="30" y="85" font-size="10" fill="#1E40AF">🔑 id UUID PK</text>
  <text x="30" y="99" font-size="10" fill="#374151">  name VARCHAR(200)</text>
  <text x="30" y="113" font-size="10" fill="#374151">  slug VARCHAR(100) UNIQUE</text>
  <text x="30" y="127" font-size="10" fill="#374151">  country CHAR(2)</text>
  <text x="30" y="141" font-size="10" fill="#374151">  plan VARCHAR(20)</text>
</g>

<!-- ═══ USERS ═══ -->
<g id="users">
  <rect x="20" y="185" width="190" height="140" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="20" y="185" width="190" height="26" rx="8" fill="#2563EB"/>
  <rect x="20" y="203" width="190" height="8" fill="#2563EB"/>
  <text x="115" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="white">users</text>
  <text x="30" y="225" font-size="10" fill="#1E40AF">🔑 id UUID PK</text>
  <text x="30" y="239" font-size="10" fill="#DC2626">🔗 organization_id FK</text>
  <text x="30" y="253" font-size="10" fill="#374151">  email VARCHAR(255)</text>
  <text x="30" y="267" font-size="10" fill="#374151">  full_name VARCHAR(200)</text>
  <text x="30" y="281" font-size="10" fill="#374151">  role VARCHAR(30)</text>
  <text x="30" y="295" font-size="10" fill="#374151">  is_active BOOLEAN</text>
  <text x="30" y="309" font-size="10" fill="#374151">  password_hash TEXT</text>
</g>

<!-- ═══ PATIENTS ═══ -->
<g id="patients">
  <rect x="250" y="45" width="200" height="140" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <rect x="250" y="45" width="200" height="26" rx="8" fill="#059669"/>
  <rect x="250" y="63" width="200" height="8" fill="#059669"/>
  <text x="350" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="white">patients</text>
  <text x="260" y="85" font-size="10" fill="#065F46">🔑 id UUID PK</text>
  <text x="260" y="99" font-size="10" fill="#DC2626">🔗 organization_id FK</text>
  <text x="260" y="113" font-size="10" fill="#DC2626">🔗 created_by FK → users</text>
  <text x="260" y="127" font-size="10" fill="#374151">  mrn VARCHAR(50)</text>
  <text x="260" y="141" font-size="10" fill="#374151">  birth_year SMALLINT</text>
  <text x="260" y="155" font-size="10" fill="#374151">  diabetes_type VARCHAR(10)</text>
  <text x="260" y="169" font-size="10" fill="#374151">  is_active BOOLEAN</text>
</g>

<!-- ═══ FOOT_ASSESSMENTS ═══ -->
<g id="foot_assessments">
  <rect x="250" y="215" width="200" height="180" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <rect x="250" y="215" width="200" height="26" rx="8" fill="#059669"/>
  <rect x="250" y="233" width="200" height="8" fill="#059669"/>
  <text x="350" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="white">foot_assessments</text>
  <text x="260" y="255" font-size="10" fill="#065F46">🔑 id UUID PK</text>
  <text x="260" y="269" font-size="10" fill="#DC2626">🔗 patient_id FK</text>
  <text x="260" y="283" font-size="10" fill="#DC2626">🔗 assessed_by FK → users</text>
  <text x="260" y="297" font-size="10" fill="#374151">  monofilament_right/left</text>
  <text x="260" y="311" font-size="10" fill="#374151">  pulse_right/left_pedio</text>
  <text x="260" y="325" font-size="10" fill="#374151">  itb_right / itb_left</text>
  <text x="260" y="339" font-size="10" fill="#374151">  hba1c / creatinine / egfr</text>
  <text x="260" y="353" font-size="10" fill="#0369A1">  iwgdf_risk_group [0-3]</text>
  <text x="260" y="367" font-size="10" fill="#374151">  prev_ulcer / prev_amputation</text>
  <text x="260" y="381" font-size="10" fill="#374151">  charcot_active BOOLEAN</text>
</g>

<!-- ═══ WOUNDS ═══ -->
<g id="wounds">
  <rect x="490" y="45" width="200" height="155" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="490" y="45" width="200" height="26" rx="8" fill="#EA580C"/>
  <rect x="490" y="63" width="200" height="8" fill="#EA580C"/>
  <text x="590" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="white">wounds</text>
  <text x="500" y="85" font-size="10" fill="#7C2D12">🔑 id UUID PK</text>
  <text x="500" y="99" font-size="10" fill="#DC2626">🔗 patient_id FK</text>
  <text x="500" y="113" font-size="10" fill="#DC2626">🔗 created_by FK → users</text>
  <text x="500" y="127" font-size="10" fill="#374151">  foot_side CHAR(1) D/I</text>
  <text x="500" y="141" font-size="10" fill="#374151">  location VARCHAR(50)</text>
  <text x="500" y="155" font-size="10" fill="#374151">  etiology VARCHAR(30)</text>
  <text x="500" y="169" font-size="10" fill="#374151">  status (activa/cicatrizada)</text>
  <text x="500" y="183" font-size="10" fill="#374151">  wagner_grade SMALLINT</text>
</g>

<!-- ═══ WOUND_EVALUATIONS ═══ -->
<g id="wound_evaluations">
  <rect x="490" y="225" width="200" height="180" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="490" y="225" width="200" height="26" rx="8" fill="#EA580C"/>
  <rect x="490" y="243" width="200" height="8" fill="#EA580C"/>
  <text x="590" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="white">wound_evaluations</text>
  <text x="500" y="265" font-size="10" fill="#7C2D12">🔑 id UUID PK</text>
  <text x="500" y="279" font-size="10" fill="#DC2626">🔗 wound_id FK</text>
  <text x="500" y="293" font-size="10" fill="#DC2626">🔗 evaluated_by FK → users</text>
  <text x="500" y="307" font-size="10" fill="#374151">  tissue_necrotic BOOLEAN</text>
  <text x="500" y="321" font-size="10" fill="#374151">  infection_present BOOLEAN</text>
  <text x="500" y="335" font-size="10" fill="#374151">  moisture_high BOOLEAN</text>
  <text x="500" y="349" font-size="10" fill="#374151">  exudate_amount/type</text>
  <text x="500" y="363" font-size="10" fill="#0369A1">  timers_dressing_suggestion</text>
  <text x="500" y="377" font-size="10" fill="#9CA3AF">  [disclaimer educativo]</text>
  <text x="500" y="391" font-size="10" fill="#374151">  clinical_notes TEXT</text>
</g>

<!-- ═══ WOUND_IMAGES ═══ -->
<g id="wound_images">
  <rect x="730" y="45" width="200" height="195" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="1.5"/>
  <rect x="730" y="45" width="200" height="26" rx="8" fill="#9333EA"/>
  <rect x="730" y="63" width="200" height="8" fill="#9333EA"/>
  <text x="830" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="white">wound_images</text>
  <text x="740" y="85" font-size="10" fill="#581C87">🔑 id UUID PK</text>
  <text x="740" y="99" font-size="10" fill="#DC2626">🔗 wound_id FK</text>
  <text x="740" y="113" font-size="10" fill="#DC2626">🔗 wound_evaluation_id FK</text>
  <text x="740" y="127" font-size="10" fill="#DC2626">🔗 uploaded_by FK → users</text>
  <text x="740" y="141" font-size="10" fill="#374151">  storage_bucket/key (MinIO)</text>
  <text x="740" y="155" font-size="10" fill="#374151">  file_hash_sha256 CHAR(64)</text>
  <text x="740" y="169" font-size="10" fill="#374151">  qc_blur_score NUMERIC</text>
  <text x="740" y="183" font-size="10" fill="#374151">  qc_scale_detected BOOLEAN</text>
  <text x="740" y="197" font-size="10" fill="#374151">  qc_scale_px_per_mm</text>
  <text x="740" y="211" font-size="10" fill="#374151">  qc_passed BOOLEAN</text>
  <text x="740" y="225" font-size="10" fill="#374151">  capture_method (camera/gallery)</text>
</g>

<!-- ═══ INFERENCE_RUNS ═══ -->
<g id="inference_runs">
  <rect x="730" y="265" width="200" height="225" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="1.5"/>
  <rect x="730" y="265" width="200" height="26" rx="8" fill="#9333EA"/>
  <rect x="730" y="283" width="200" height="8" fill="#9333EA"/>
  <text x="830" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="white">inference_runs</text>
  <text x="740" y="305" font-size="10" fill="#581C87">🔑 id UUID PK</text>
  <text x="740" y="319" font-size="10" fill="#DC2626">🔗 image_id FK</text>
  <text x="740" y="333" font-size="10" fill="#DC2626">🔗 model_version_id FK</text>
  <text x="740" y="347" font-size="10" fill="#DC2626">🔗 reviewed_by FK → users</text>
  <text x="740" y="361" font-size="10" fill="#374151">  mask_storage_key</text>
  <text x="740" y="375" font-size="10" fill="#374151">  area_cm2 NUMERIC</text>
  <text x="740" y="389" font-size="10" fill="#374151">  granulation/fibrin/necrosis %</text>
  <text x="740" y="403" font-size="10" fill="#0369A1">  triage_severity [0-10]</text>
  <text x="740" y="417" font-size="10" fill="#0369A1">  triage_color verde/amarillo/rojo</text>
  <text x="740" y="431" font-size="10" fill="#374151">  questionnaire_data JSONB</text>
  <text x="740" y="445" font-size="10" fill="#059669">  review_action (aceptado/corregido)</text>
  <text x="740" y="459" font-size="10" fill="#9CA3AF">  [revisión humana obligatoria]</text>
  <text x="740" y="473" font-size="10" fill="#374151">  status pending/success/failed</text>
</g>

<!-- ═══ MODEL_VERSIONS ═══ -->
<g id="model_versions">
  <rect x="730" y="515" width="200" height="130" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="1.5"/>
  <rect x="730" y="515" width="200" height="26" rx="8" fill="#9333EA"/>
  <rect x="730" y="533" width="200" height="8" fill="#9333EA"/>
  <text x="830" y="533" text-anchor="middle" font-size="12" font-weight="bold" fill="white">model_versions</text>
  <text x="740" y="555" font-size="10" fill="#581C87">🔑 id UUID PK</text>
  <text x="740" y="569" font-size="10" fill="#374151">  name / version</text>
  <text x="740" y="583" font-size="10" fill="#374151">  model_type VARCHAR(30)</text>
  <text x="740" y="597" font-size="10" fill="#374151">  architecture TEXT</text>
  <text x="740" y="611" font-size="10" fill="#374151">  dice_score / iou_score</text>
  <text x="740" y="625" font-size="10" fill="#374151">  weights_path (MinIO)</text>
  <text x="740" y="639" font-size="10" fill="#374151">  is_active BOOLEAN</text>
</g>

<!-- ═══ GENERATED_REPORTS ═══ -->
<g id="generated_reports">
  <rect x="20" y="360" width="200" height="140" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <rect x="20" y="360" width="200" height="26" rx="8" fill="#D97706"/>
  <rect x="20" y="378" width="200" height="8" fill="#D97706"/>
  <text x="120" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="white">generated_reports</text>
  <text x="30" y="400" font-size="10" fill="#78350F">🔑 id UUID PK</text>
  <text x="30" y="414" font-size="10" fill="#DC2626">🔗 patient_id FK</text>
  <text x="30" y="428" font-size="10" fill="#DC2626">🔗 generated_by FK → users</text>
  <text x="30" y="442" font-size="10" fill="#374151">  report_type VARCHAR(30)</text>
  <text x="30" y="456" font-size="10" fill="#374151">  storage_key (PDF MinIO)</text>
  <text x="30" y="470" font-size="10" fill="#374151">  version SMALLINT</text>
  <text x="30" y="484" font-size="10" fill="#9CA3AF">  [disclaimer obligatorio]</text>
</g>

<!-- ═══ SCIENTIFIC_ARTICLES ═══ -->
<g id="scientific_articles">
  <rect x="20" y="530" width="190" height="115" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="20" y="530" width="190" height="26" rx="8" fill="#16A34A"/>
  <rect x="20" y="548" width="190" height="8" fill="#16A34A"/>
  <text x="115" y="548" text-anchor="middle" font-size="12" font-weight="bold" fill="white">scientific_articles</text>
  <text x="30" y="570" font-size="10" fill="#14532D">🔑 id UUID PK</text>
  <text x="30" y="584" font-size="10" fill="#374151">  pmid VARCHAR UNIQUE</text>
  <text x="30" y="598" font-size="10" fill="#374151">  doi / title / authors</text>
  <text x="30" y="612" font-size="10" fill="#374151">  journal / pub_date</text>
  <text x="30" y="626" font-size="10" fill="#374151">  source (pubmed/manual)</text>
</g>

<!-- ═══ SCIENTIFIC_SUMMARIES ═══ -->
<g id="scientific_summaries">
  <rect x="230" y="530" width="210" height="115" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="230" y="530" width="210" height="26" rx="8" fill="#16A34A"/>
  <rect x="230" y="548" width="210" height="8" fill="#16A34A"/>
  <text x="335" y="548" text-anchor="middle" font-size="12" font-weight="bold" fill="white">scientific_summaries</text>
  <text x="240" y="570" font-size="10" fill="#14532D">🔑 id UUID PK</text>
  <text x="240" y="584" font-size="10" fill="#DC2626">🔗 article_id FK</text>
  <text x="240" y="598" font-size="10" fill="#374151">  audience (medico/paciente)</text>
  <text x="240" y="612" font-size="10" fill="#374151">  summary_text TEXT</text>
  <text x="240" y="626" font-size="10" fill="#0369A1">  embedding VECTOR(1536) ← pgvector</text>
</g>

<!-- ═══ AUDIT_EVENTS ═══ -->
<g id="audit_events">
  <rect x="460" y="530" width="210" height="130" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="460" y="530" width="210" height="26" rx="8" fill="#DC2626"/>
  <rect x="460" y="548" width="210" height="8" fill="#DC2626"/>
  <text x="565" y="548" text-anchor="middle" font-size="12" font-weight="bold" fill="white">audit_events</text>
  <text x="470" y="570" font-size="10" fill="#7F1D1D">🔑 id BIGSERIAL PK</text>
  <text x="470" y="584" font-size="10" fill="#DC2626">🔗 user_id FK (nullable)</text>
  <text x="470" y="598" font-size="10" fill="#DC2626">🔗 organization_id FK</text>
  <text x="470" y="612" font-size="10" fill="#374151">  event_type VARCHAR(50)</text>
  <text x="470" y="626" font-size="10" fill="#374151">  entity_type / entity_id</text>
  <text x="470" y="640" font-size="10" fill="#374151">  ip_address / extra_data JSONB</text>
  <text x="470" y="654" font-size="10" fill="#9CA3AF">  [append-only, no UPDATE/DELETE]</text>
</g>

<!-- ═══ RELACIONES (líneas) ═══ -->
<!-- organizations → users -->
<line x1="115" y1="155" x2="115" y2="185" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- organizations → patients -->
<line x1="210" y1="100" x2="250" y2="100" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- patients → foot_assessments -->
<line x1="350" y1="185" x2="350" y2="215" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- patients → wounds -->
<line x1="450" y1="100" x2="490" y2="100" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- wounds → wound_evaluations -->
<line x1="590" y1="200" x2="590" y2="225" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- wounds → wound_images -->
<line x1="690" y1="100" x2="730" y2="100" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- wound_evaluations → wound_images -->
<line x1="690" y1="290" x2="730" y2="200" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- wound_images → inference_runs -->
<line x1="830" y1="240" x2="830" y2="265" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- model_versions → inference_runs -->
<line x1="830" y1="515" x2="830" y2="490" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- patients → generated_reports -->
<line x1="120" y1="185" x2="120" y2="360" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<!-- scientific_articles → scientific_summaries -->
<line x1="210" y1="588" x2="230" y2="588" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ═══ LEYENDA ═══ -->
<rect x="20" y="680" width="700" height="60" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<text x="35" y="700" font-size="11" font-weight="bold" fill="#1A1A2E">Leyenda:</text>
<text x="35" y="716" font-size="10" fill="#1E40AF">🔑 PK = Clave primaria UUID</text>
<text x="180" y="716" font-size="10" fill="#DC2626">🔗 FK = Clave foránea</text>
<text x="310" y="716" font-size="10" fill="#0369A1">Azul = campos calculados por agentes IA</text>
<text x="550" y="716" font-size="10" fill="#9CA3AF">Gris = notas de diseño</text>
<text x="35" y="730" font-size="10" fill="#374151">10 dominios · 13 tablas · 22 índices · 25 constraints · pgvector para búsqueda semántica de artículos científicos</text>

<!-- Nota de separación MinIO -->
<rect x="730" y="680" width="340" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="745" y="700" font-size="11" font-weight="bold" fill="#78350F">Almacenamiento externo (MinIO):</text>
<text x="745" y="716" font-size="10" fill="#374151">• Imágenes originales (inmutables)</text>
<text x="745" y="730" font-size="10" fill="#374151">• Máscaras de segmentación IA · PDFs clínicos</text>
</svg>
