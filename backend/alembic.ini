# ╔══════════════════════════════════════════════════════════════════════╗
# ║  ALEMBIC.INI — Configuración de Migraciones                        ║
# ║  piediabetico.lat                                                   ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  Uso:                                                              ║
# ║    Crear tablas:    alembic upgrade head                           ║
# ║    Revertir todo:   alembic downgrade base                         ║
# ║    Ver estado:      alembic current                                ║
# ║    Ver historial:   alembic history                                ║
# ╚══════════════════════════════════════════════════════════════════════╝

[alembic]
# Carpeta donde están los scripts de migración
script_location = alembic

# Formato del nombre de los archivos de migración
# Ejemplo: 20260823_143022_crear_tablas_iniciales.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncar nombres largos de migraciones
truncate_slug_length = 40

# La URL de la base de datos se lee desde la variable de entorno
# DATABASE_URL=postgresql://adminpd:PASSWORD@postgres:5432/piediadbetico
# NO hardcodear la URL aquí — usar la variable de entorno en env.py
sqlalchemy.url = postgresql://adminpd:password@localhost:5432/piediadbetico

# Timezone para los timestamps de migraciones
timezone = America/Argentina/Buenos_Aires

[post_write_hooks]
# Sin hooks por ahora

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
