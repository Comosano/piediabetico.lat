# ╔══════════════════════════════════════════════════════════════════════╗
# ║  NGINX_PRODUCTION.CONF — piediabetico.lat                           ║
# ║  Separación de Dominios: Portal, App Clínica y API Backend           ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Redirección HTTP -> HTTPS Global ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name piediabetico.lat www.piediabetico.lat app.piediabetico.lat api.piediabetico.lat;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 1. PORTAL INSTITUCIONAL (piediabetico.lat) ─────────────────────────
# Pabellón Científico, Sociedades Médicas, Universidades, Guías y Congresos
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name piediabetico.lat www.piediabetico.lat;

    # SSL Certificates (Completado por Certbot / Cloudflare Origin CA)
    # ssl_certificate     /etc/letsencrypt/live/piediabetico.lat/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/piediabetico.lat/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/piediabetico/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|css|js|ico|png|jpg|jpeg|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ── 2. APP CLÍNICA MOBILE-FIRST PWA (app.piediabetico.lat) ─────────────
# Portales de Pacientes y Profesionales, Triage y Calculadoras
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.piediabetico.lat;

    # SSL Certificates
    # ssl_certificate     /etc/letsencrypt/live/piediabetico.lat/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/piediabetico.lat/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/piediabetico/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|css|js|json|png|jpg|jpeg|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }
}

# ── 3. API BACKEND FASTAPI (api.piediabetico.lat) ──────────────────────
# Endpoints de IA, RBAC, Base de Datos y Calculadoras Clínicas
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.piediabetico.lat;

    # SSL Certificates
    # ssl_certificate     /etc/letsencrypt/live/piediabetico.lat/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/piediabetico.lat/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 25M;
    proxy_read_timeout    120s;
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
