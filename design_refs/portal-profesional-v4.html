<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0c2461"/>
<title>piediabetico.lat — Portal Profesional</title>
<style>
:root{
  --azul:#1e3a5f;--azul-d:#0c2461;--azul-l:#dbeafe;--azul-b:#bfdbfe;--azul-t:#1e40af;
  --verde:#16a34a;--verde-l:#dcfce7;--verde-b:#bbf7d0;--verde-t:#14532d;
  --rojo:#dc2626;--rojo-l:#fee2e2;--rojo-b:#fca5a5;--rojo-t:#7f1d1d;
  --amber:#d97706;--amber-l:#fef9c3;--amber-b:#fde68a;--amber-t:#713f12;
  --purple:#7c3aed;--purple-l:#ede9fe;--purple-b:#c4b5fd;--purple-t:#4c1d95;
  --gris:#64748b;--gris-l:#f1f5f9;--gris-b:#e2e8f0;
  --surf:#fff;--surf1:#f8fafc;--surf2:#f1f5f9;
  --borde:#e2e8f0;--borde-m:#cbd5e1;
  --txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;
  --r:12px;--r-sm:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --surf:#0f172a;--surf1:#1e293b;--surf2:#283347;
  --borde:#334155;--borde-m:#475569;
  --txt:#f1f5f9;--txt2:#94a3b8;--txt3:#64748b;
  --azul-l:#1e3a5f;--azul-b:#1e40af;
  --verde-l:#14532d;--verde-b:#065f46;
  --rojo-l:#7f1d1d;--rojo-b:#991b1b;
  --amber-l:#78350f;--amber-b:#92400e;
  --purple-l:#4c1d95;--purple-b:#5b21b6;
  --gris-l:#1e293b;--gris-b:#334155;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--surf1);color:var(--txt);min-height:100dvh;display:flex;flex-direction:column;max-width:600px;margin:0 auto}

.topbar{background:var(--azul-d);padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:52px;position:sticky;top:0;z-index:100}
.t-logo{font-size:15px;font-weight:600;color:#fff;flex:1}.t-logo span{color:#60a5fa}
.t-title{font-size:15px;font-weight:500;color:#fff;flex:1;display:none}
.back-btn{display:none;align-items:center;gap:4px;background:none;border:none;color:rgba(255,255,255,.8);font-size:13px;font-family:var(--font);cursor:pointer;padding:4px 0;min-height:44px;flex-shrink:0}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.t-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}

.status-bar{background:rgba(0,0,0,.25);padding:6px 16px;display:flex;gap:12px;flex-wrap:wrap}
.status-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.8)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-on{background:#4ade80}.dot-off{background:#64748b}

.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.body{padding:16px;flex:1}

.page-title{font-size:20px;font-weight:700;color:var(--txt);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--txt2);margin-bottom:16px;line-height:1.5}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin:20px 0 8px}
.sec-label:first-child{margin-top:0}

.btn{width:100%;padding:14px 18px;border-radius:var(--r);border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent;min-height:48px}
.btn:active{transform:scale(.98);opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.btn-azul{background:var(--azul);color:#fff}
.btn-azul-d{background:var(--azul-d);color:#fff}
.btn-verde{background:var(--verde);color:#fff}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-outline{background:var(--surf);color:var(--txt);border:1.5px solid var(--borde-m)}
.btn-ghost{background:none;color:var(--txt2);border:1px solid var(--borde)}
.btn-sm{min-height:44px;font-size:13px;padding:10px 14px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

.card{background:var(--surf);border:1px solid var(--borde);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-titulo{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:6px}
.card-sub{font-size:13px;color:var(--txt2);line-height:1.5}
.card-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--borde);border-radius:var(--r);padding:14px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s;min-height:64px}
.card-row:hover,.card-row:focus-within{border-color:var(--azul)}
.card-row:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

.pilot-av{width:42px;height:42px;border-radius:var(--r-sm);background:var(--azul-l);color:var(--azul-t);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-align:center;line-height:1.2}
.pilot-info{flex:1}
.pilot-id{display:block;font-size:14px;font-weight:600;color:var(--txt);margin-bottom:2px}
.pilot-detail{display:block;font-size:12px;color:var(--txt2)}
.badge{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:500;flex-shrink:0;white-space:nowrap}
.badge-azul{background:var(--azul-l);color:var(--azul-t)}
.badge-amber{background:var(--amber-l);color:var(--amber-t)}
.badge-gris{background:var(--gris-l);color:var(--gris)}
.badge-verde{background:var(--verde-l);color:var(--verde-t)}
.chev{color:var(--txt3);font-size:18px;flex-shrink:0}

.aviso{background:var(--amber-l);border:1.5px solid var(--amber-b);border-radius:var(--r);padding:13px 14px;display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.aviso-ico{font-size:18px;flex-shrink:0;margin-top:1px}
.aviso-txt{flex:1}
.aviso-txt strong{display:block;font-size:13px;color:var(--amber-t);font-weight:600}
.aviso-txt span{font-size:12px;color:var(--amber-t)}
.aviso-label{font-size:10px;padding:3px 8px;border-radius:99px;background:var(--amber);color:#fff;font-weight:700;margin-left:auto;align-self:flex-start;flex-shrink:0;white-space:nowrap}

.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.quick-btn{background:var(--surf);border:1.5px solid var(--borde);border-radius:var(--r);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:var(--font);-webkit-tap-highlight-color:transparent;transition:border-color .15s;min-height:88px}
.quick-btn:hover,.quick-btn:focus-visible{border-color:var(--azul)}
.quick-btn:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.quick-btn.acc{background:var(--azul-d);border-color:var(--azul-d)}
.quick-ico{font-size:26px}
.quick-btn span{font-size:13px;font-weight:600;color:var(--txt);text-align:center}
.quick-btn.acc span{color:#fff}
.quick-btn small{font-size:11px;color:var(--txt3);text-align:center}
.quick-btn.acc small{color:rgba(255,255,255,.65)}

.demo-tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;background:var(--amber-l);color:var(--amber-t);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:4px;vertical-align:middle}

/* HERIDAS */
.herida-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--borde);border-radius:var(--r);padding:12px 14px;margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s;min-height:56px}
.herida-row:hover{border-color:var(--azul)}
.herida-ico{width:36px;height:36px;border-radius:var(--r-sm);background:var(--azul-l);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.herida-info{flex:1}
.herida-nombre{font-size:14px;font-weight:500;color:var(--txt)}
.herida-detalle{font-size:12px;color:var(--txt2)}
.nueva-herida-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:1.5px dashed var(--borde-m);border-radius:var(--r);padding:12px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;color:var(--azul-t);width:100%;-webkit-tap-highlight-color:transparent;min-height:48px;margin-top:2px;transition:border-color .15s}
.nueva-herida-btn:hover{border-color:var(--azul)}

/* CALC CARD */
.calc-card{background:var(--surf);border:1px solid var(--borde);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s;min-height:72px}
.calc-card:hover,.calc-card:focus-visible{border-color:var(--azul)}
.calc-card:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.calc-ico-box{width:42px;height:42px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.calc-body{flex:1}
.calc-name{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:2px}
.calc-desc{font-size:12px;color:var(--txt2);line-height:1.4;margin-bottom:6px}
.calc-chip{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;display:inline-block}
.chip-azul{background:var(--azul-l);color:var(--azul-t)}
.chip-purple{background:var(--purple-l);color:var(--purple-t)}
.chip-verde{background:var(--verde-l);color:var(--verde-t)}
.chip-amber{background:var(--amber-l);color:var(--amber-t)}
.chip-gris{background:var(--gris-l);color:var(--gris)}

.calc-header{background:var(--azul-d);padding:16px;color:#fff}
.calc-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.calc-header p{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5}
.calc-form-body{padding:16px;flex:1;overflow-y:auto}
.field-label{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:8px;display:block}
.field-hint{font-size:11px;color:var(--txt3);margin-top:-4px;margin-bottom:10px;display:block}
.seg{display:flex;background:var(--surf2);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.seg-btn{flex:1;min-width:0;padding:9px 4px;border-radius:6px;border:none;font-size:11px;font-weight:500;color:var(--txt2);background:none;cursor:pointer;font-family:var(--font);-webkit-tap-highlight-color:transparent;text-align:center;transition:all .15s;line-height:1.3;min-height:44px}
.seg-btn.on{background:var(--surf);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.num-inp{width:100%;padding:11px 12px;border:1.5px solid var(--borde-m);border-radius:var(--r-sm);font-size:16px;color:var(--txt);background:var(--surf);font-family:var(--font);margin-bottom:14px;min-height:44px}
.num-inp:focus{outline:none;border-color:var(--azul)}

/* PLACEHOLDER resultado calc */
.calc-placeholder{background:var(--surf2);border:1.5px dashed var(--borde-m);border-radius:var(--r);padding:16px;margin:14px 0;text-align:center}
.calc-placeholder p{font-size:12px;color:var(--txt3);line-height:1.5}

/* ANÁLISIS */
.analisis-row{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--borde)}
.analisis-row:last-child{border-bottom:none}
.analisis-label{font-size:13px;color:var(--txt2);flex:1}
.analisis-val{font-size:13px;font-weight:600;color:var(--txt);text-align:right;flex-shrink:0;margin-left:12px}
.analisis-val.ok{color:var(--verde)}
.analisis-val.nd{color:var(--txt3);font-weight:400}

/* PRIVACY */
.privacy-box{background:var(--surf);border:1.5px solid var(--borde-m);border-radius:var(--r);padding:14px;margin-bottom:14px}
.privacy-titulo{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde);cursor:pointer;-webkit-tap-highlight-color:transparent}
.check-item:last-child{border-bottom:none;padding-bottom:0}
.check-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--borde-m);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-top:1px}
.check-box.on{background:var(--azul);border-color:var(--azul)}
.check-box svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;display:none}
.check-box.on svg{display:block}
.check-txt{font-size:13px;color:var(--txt);line-height:1.4;flex:1}

/* QUALITY GATE */
.quality-card{border-radius:var(--r);padding:20px;margin-bottom:14px;text-align:center}
.quality-card.ok{background:var(--verde-l);border:1.5px solid var(--verde-b)}
.quality-card.fail{background:var(--rojo-l);border:1.5px solid var(--rojo-b)}
.quality-ico{font-size:44px;margin-bottom:8px;display:block}
.quality-titulo{font-size:16px;font-weight:700;margin-bottom:6px}
.quality-card.ok .quality-titulo{color:var(--verde-t)}
.quality-card.fail .quality-titulo{color:var(--rojo-t)}
.quality-desc{font-size:13px;line-height:1.5}
.quality-card.ok .quality-desc{color:var(--verde-t)}
.quality-card.fail .quality-desc{color:var(--rojo-t)}

/* SHADOW MODE */
.shadow-card{background:var(--azul-l);border:1.5px solid var(--azul-b);border-radius:var(--r);padding:16px;margin-bottom:14px}
.shadow-titulo{font-size:14px;font-weight:700;color:var(--azul-d);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.shadow-sub{font-size:12px;color:var(--azul-t);margin-bottom:14px;line-height:1.5}
.shadow-label{font-size:12px;font-weight:600;color:var(--azul-t);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.shadow-opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.shadow-opt{padding:9px 14px;border-radius:var(--r-sm);border:1.5px solid var(--azul-b);background:var(--surf);font-size:13px;font-weight:500;color:var(--azul-t);cursor:pointer;font-family:var(--font);-webkit-tap-highlight-color:transparent;transition:all .15s;min-height:44px}
.shadow-opt.on{background:var(--azul);border-color:var(--azul);color:#fff}
.shadow-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--azul-b);border-radius:var(--r-sm);font-size:13px;color:var(--txt);background:var(--surf);font-family:var(--font);resize:none;height:72px}
.shadow-textarea:focus{outline:none;border-color:var(--azul)}

/* TIMELINE */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px;padding-bottom:20px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid var(--borde-m);background:var(--surf);z-index:1}
.tl-dot.azul{border-color:var(--azul);background:var(--azul)}
.tl-dot.gris{border-color:var(--borde-m);background:var(--surf2)}
.tl-line{width:1px;flex:1;background:var(--borde);margin-top:4px}
.tl-item:last-child .tl-line{display:none}
.tl-content{flex:1}
.tl-fecha{font-size:11px;color:var(--txt3);margin-bottom:4px;font-weight:500}
.tl-card{background:var(--surf);border:1px solid var(--borde);border-radius:var(--r-sm);padding:12px;margin-bottom:2px}
.tl-card-title{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:6px}
.tl-dato{font-size:12px;color:var(--txt2);margin-bottom:2px}
.tl-dato strong{color:var(--txt);font-weight:500}
.tl-thumb{width:100%;height:72px;border-radius:var(--r-sm);background:var(--surf2);margin-top:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--txt3)}
.tl-expired{width:100%;border-radius:var(--r-sm);background:var(--surf2);margin-top:8px;display:flex;align-items:center;justify-content:center;padding:10px;border:1px dashed var(--borde-m);min-height:60px}
.tl-expired p{font-size:11px;color:var(--txt3);text-align:center;line-height:1.4}

/* COMPARADOR */
.comp-warning{background:var(--amber-l);border:1.5px solid var(--amber-b);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px;display:flex;gap:8px}
.comp-warning-ico{font-size:16px;flex-shrink:0}
.comp-warning p{font-size:12px;color:var(--amber-t);line-height:1.5}
.comparador-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.comp-foto{background:var(--surf2);border-radius:var(--r-sm);height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--borde);font-size:11px;color:var(--txt3);text-align:center;padding:8px}
.comp-foto-lbl{font-size:12px;font-weight:600;color:var(--txt);margin-top:6px}
.comp-foto-meta{font-size:11px;color:var(--txt3)}
.evol-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.evol-btn{padding:12px 8px;border-radius:var(--r-sm);border:1.5px solid var(--borde-m);background:var(--surf);font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;font-family:var(--font);-webkit-tap-highlight-color:transparent;text-align:center;transition:all .15s;min-height:48px}
.evol-btn.on{border-color:var(--azul);background:var(--azul-l);color:var(--azul-t)}
.repres-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.rep-btn{padding:10px 8px;border-radius:var(--r-sm);border:1.5px solid var(--borde-m);background:var(--surf);font-size:13px;font-weight:500;color:var(--txt);cursor:pointer;font-family:var(--font);-webkit-tap-highlight-color:transparent;text-align:center;transition:all .15s;min-height:44px}
.rep-btn.on{border-color:var(--azul);background:var(--azul-l);color:var(--azul-t)}

/* MODAL SEGUIMIENTO */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0 0 env(safe-area-inset-bottom,0)}
.modal-overlay.hidden{display:none}
.modal-sheet{background:var(--surf);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:600px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;border-radius:99px;background:var(--borde-m);margin:0 auto 20px;display:block}
.modal-title{font-size:17px;font-weight:700;color:var(--txt);margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--txt2);margin-bottom:16px;line-height:1.5}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--borde)}
.modal-row:last-of-type{border-bottom:none}
.modal-row-label{font-size:13px;color:var(--txt2)}
.modal-row-val{font-size:13px;font-weight:600;color:var(--txt)}
.link-box{background:var(--surf2);border-radius:var(--r-sm);padding:12px;display:flex;align-items:center;gap:10px;margin:12px 0}
.link-box span{font-size:12px;color:var(--azul-t);font-family:monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-box button{font-size:12px;font-weight:600;color:var(--azul);background:none;border:none;cursor:pointer;font-family:var(--font);min-height:44px;padding:0 8px}

/* SELECTOR CASO/HERIDA */
.selector-card{background:var(--surf);border:1.5px solid var(--borde-m);border-radius:var(--r);padding:14px;margin-bottom:12px}
.selector-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:8px}
.select-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--borde);border-radius:var(--r-sm);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;margin-bottom:6px;min-height:48px}
.select-opt:hover,.select-opt.on{border-color:var(--azul);background:var(--azul-l)}
.select-opt-txt{flex:1;font-size:13px;font-weight:500;color:var(--txt)}
.select-opt.on .select-opt-txt{color:var(--azul-t)}
.select-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--borde-m);flex-shrink:0;transition:all .15s}
.select-opt.on .select-dot{background:var(--azul);border-color:var(--azul)}

/* LOGIN */
.login-hero{background:var(--azul-d);padding:32px 24px;text-align:center}
.login-logo{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}.login-logo span{color:#60a5fa}
.login-sub{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:0}
.login-body{padding:24px 20px;flex:1}
.login-field{margin-bottom:14px}
.login-label{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:6px;display:block}
.login-input{width:100%;padding:13px 14px;border:1.5px solid var(--borde-m);border-radius:var(--r-sm);font-size:16px;color:var(--txt);background:var(--surf);font-family:var(--font);min-height:48px}
.login-input:focus{outline:none;border-color:var(--azul)}
.login-note{font-size:11px;color:var(--txt3);text-align:center;line-height:1.5;margin-top:12px}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0}
.spinner{width:44px;height:44px;border:3px solid var(--azul-l);border-top-color:var(--azul);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--txt2);text-align:center}

.nav-bottom{display:flex;border-top:1px solid var(--borde);background:var(--surf);padding-bottom:env(safe-area-inset-bottom,0px);position:sticky;bottom:0}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border:none;background:none;cursor:pointer;color:var(--txt3);font-family:var(--font);-webkit-tap-highlight-color:transparent;transition:color .15s;font-size:10px;min-height:56px}
.nav-tab.on{color:var(--azul)}
.nav-tab-ico{font-size:22px;line-height:1}

.disclaimer{background:var(--surf2);border-left:3px solid var(--azul-b);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:12px 0}
.disclaimer p{font-size:12px;color:var(--txt2);line-height:1.5}
.legal{font-size:11px;color:var(--txt3);text-align:center;line-height:1.5;padding:8px 0}
.espacio{height:16px}
.mt8{margin-top:8px}.mb8{margin-bottom:8px}
</style>
